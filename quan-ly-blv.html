<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Quản lý BLV</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Segoe UI',sans-serif;background:#0D0A2A;color:#eee;min-height:100vh;padding:20px 16px;}
.wrap{max-width:680px;margin:0 auto;}
h1{font-size:18px;font-weight:700;color:#FFD700;margin-bottom:3px;}
.sub{font-size:11px;color:#666;margin-bottom:16px;}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);min-width:280px;max-width:90vw;padding:12px 20px;border-radius:10px;font-size:14px;font-weight:600;text-align:center;z-index:9999;box-shadow:0 4px 20px rgba(0,0,0,.5);animation:slideUp .3s ease;}
.toast.ok{background:#00A651;color:#fff;border:2px solid #00d466;}
.toast.err{background:#CC0000;color:#fff;border:2px solid #ff4444;}
@keyframes slideUp{from{opacity:0;transform:translateX(-50%) translateY(20px);}to{opacity:1;transform:translateX(-50%) translateY(0);}}
.cards{display:flex;flex-direction:column;gap:10px;margin-bottom:16px;}
.card{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:8px;padding:10px;display:flex;gap:10px;transition:opacity .2s,transform .2s;}
.card.dragging{opacity:.4;transform:scale(.98);}
.card.drag-over{border-color:#FFD700;background:rgba(255,215,0,.08);}
.drag-handle{flex-shrink:0;display:flex;align-items:center;padding:0 4px 0 0;cursor:grab;color:#555;font-size:20px;user-select:none;touch-action:none;}
.drag-handle:active{cursor:grabbing;color:#FFD700;}
.card-left{flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:4px;}
.card-left img{width:64px;height:64px;object-fit:cover;border-radius:6px;background:#111;}
.btn-upload{background:rgba(255,255,255,.08);color:#aaa;border:1px solid rgba(255,255,255,.12);padding:3px 8px;border-radius:4px;cursor:pointer;font-size:9px;}
input[type=file]{display:none;}
.card-right{flex:1;min-width:0;}
.card-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
.card-name{font-size:13px;font-weight:700;color:#fff;}
.btn-del{background:#CC0000;color:#fff;border:none;padding:3px 8px;border-radius:4px;cursor:pointer;font-size:10px;}
.fields{display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px;}
.field{display:flex;flex-direction:column;gap:2px;}
.field.half{grid-column:span 1;}
.field label{font-size:9px;color:#666;letter-spacing:.3px;text-transform:uppercase;}
.field input{background:rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.1);border-radius:4px;padding:4px 7px;color:#fff;font-size:11px;width:100%;}
.field input:focus{outline:none;border-color:#FFD700;}
.btn-save-card{background:#00A651;color:#fff;border:none;padding:3px 10px;border-radius:4px;cursor:pointer;font-size:10px;font-weight:700;}
.bottom{display:flex;gap:8px;}
.btn{padding:7px 16px;border-radius:6px;border:none;cursor:pointer;font-size:12px;font-weight:700;}
.btn-save{background:#00A651;color:#fff;}
.btn-add{background:#1844C8;color:#fff;}
.hint{font-size:10px;color:#444;margin-top:6px;}
</style>
</head>
<body>
<div class="wrap">
<h1>⚙️ Quản lý BLV</h1>
<p class="sub">Kéo <b>⠿</b> để sắp xếp · Chỉnh sửa → nhấn <b>💾 Lưu</b> để đồng bộ ngay</p>
<div id="cardList" class="cards"></div>
<div class="bottom">
  <button class="btn btn-add" onclick="addBLV()">+ Thêm</button>
  <button class="btn btn-save" onclick="saveAll()">💾 Lưu tất cả</button>
</div>
<p class="hint">Dữ liệu lưu trực tiếp vào Cloudflare KV — cập nhật ngay lập tức</p>
</div>

<script>
var WORKER_URL='https://luongson-blv-api.antlivetructiep.workers.dev/';
var WORKER_PASS=localStorage.getItem('blv_pass')||'socolive2026';
var REPO='akanji688-ux/socoliveblv-wc2026';
var TOKEN=localStorage.getItem('gh_tok')||'';
var blvData=[];
var dragSrcIdx=-1;

function updateCardStyle(i,hidden){
  var card=document.getElementById('card-'+i);
  if(card) card.style.opacity=hidden?'0.45':'1';
}

function initDrag(){
  var list=document.getElementById('cardList');
  list.querySelectorAll('.card').forEach(function(card){
    var handle=card.querySelector('.drag-handle');
    var idx=parseInt(card.dataset.idx);

    // Desktop
    handle.addEventListener('mousedown',function(){card.setAttribute('draggable','true');});
    card.addEventListener('dragstart',function(e){
      dragSrcIdx=idx;card.classList.add('dragging');
      e.dataTransfer.effectAllowed='move';
    });
    card.addEventListener('dragend',function(){
      card.removeAttribute('draggable');card.classList.remove('dragging');
      list.querySelectorAll('.card').forEach(function(c){c.classList.remove('drag-over');});
    });
    card.addEventListener('dragover',function(e){
      e.preventDefault();
      list.querySelectorAll('.card').forEach(function(c){c.classList.remove('drag-over');});
      card.classList.add('drag-over');
    });
    card.addEventListener('drop',function(e){
      e.preventDefault();
      var toIdx=parseInt(card.dataset.idx);
      if(dragSrcIdx<0||dragSrcIdx===toIdx)return;
      var moved=blvData.splice(dragSrcIdx,1)[0];
      blvData.splice(toIdx,0,moved);
      dragSrcIdx=-1;
      renderCards();
    });

    // Touch
    var tStartY=0,tClone=null,tIdx=-1,tCard=null;
    handle.addEventListener('touchstart',function(e){
      tIdx=idx;tCard=card;tStartY=e.touches[0].clientY;
      card.classList.add('dragging');
      var r=card.getBoundingClientRect();
      tClone=card.cloneNode(true);
      tClone.style.cssText='position:fixed;left:'+r.left+'px;top:'+r.top+'px;width:'+r.width+'px;opacity:.85;z-index:9999;pointer-events:none;border:2px solid #FFD700;border-radius:8px;background:#1a1040;';
      document.body.appendChild(tClone);
      e.preventDefault();
    },{passive:false});
    handle.addEventListener('touchmove',function(e){
      if(!tClone)return;
      var dy=e.touches[0].clientY-tStartY;
      tClone.style.top=(tCard.getBoundingClientRect().top+dy)+'px';
      var el=document.elementFromPoint(e.touches[0].clientX,e.touches[0].clientY);
      list.querySelectorAll('.card').forEach(function(c){c.classList.remove('drag-over');});
      if(el){var tc=el.closest('.card');if(tc&&tc!==tCard)tc.classList.add('drag-over');}
      e.preventDefault();
    },{passive:false});
    handle.addEventListener('touchend',function(){
      if(tClone){tClone.remove();tClone=null;}
      if(tCard)tCard.classList.remove('dragging');
      var ov=list.querySelector('.card.drag-over');
      if(ov){
        var toIdx=parseInt(ov.dataset.idx);
        ov.classList.remove('drag-over');
        if(tIdx>=0&&tIdx!==toIdx){
          var moved=blvData.splice(tIdx,1)[0];
          blvData.splice(toIdx,0,moved);
          renderCards();
        }
      }
      tIdx=-1;tCard=null;
    });
  });
}

function showStatus(type,msg){
  var old=document.getElementById('toast-msg');if(old)old.remove();
  var t=document.createElement('div');t.id='toast-msg';t.className='toast '+type;t.textContent=msg;
  document.body.appendChild(t);
  setTimeout(function(){t.style.transition='opacity .4s';t.style.opacity='0';setTimeout(function(){if(t.parentNode)t.remove();},400);},(type==='ok'?3000:6000));
}

function esc(s){return (s||'').replace(/"/g,'&quot;');}
function upd(i,key,val){blvData[i][key]=val;if(key==='name')document.querySelector('#card-'+i+' .card-name').textContent=val||'';}
function removeBLV(i){blvData.splice(i,1);renderCards();}
function addBLV(){blvData.push({name:'BLV Mới',img:'',nhom:'#',tele:'#',zalo:'#'});renderCards();}

function renderCards(){
  var html='';
  blvData.forEach(function(b,i){
    html+='<div class="card" id="card-'+i+'" data-idx="'+i+'">';
    html+='<div class="drag-handle" title="Kéo để sắp xếp">⠿</div>';
    html+='<div class="card-left">';
    html+='<img id="preview-'+i+'" src="'+esc(b.img)+'" onerror="this.style.opacity=.2"/>';
    html+='<label class="btn-upload" for="file-'+i+'">📷 Đổi ảnh</label>';
    html+='<input type="file" id="file-'+i+'" accept="image/*" onchange="previewImg('+i+',this)"/>';
    html+='</div>';
    html+='<div class="card-right">';
    html+='<div class="card-top"><span class="card-name">'+esc(b.name)+'</span>';
    html+='<div style="display:flex;gap:5px;">';
    html+='<label style="display:flex;align-items:center;gap:4px;cursor:pointer;font-size:10px;color:#aaa;user-select:none;" title="Ẩn BLV này">';
    html+='<input type="checkbox"'+(b.hidden?' checked':'')+' onchange="blvData['+i+'].hidden=this.checked;updateCardStyle('+i+',this.checked)" style="accent-color:#CC0000;width:13px;height:13px;cursor:pointer;"/> Ẩn</label>';
    html+='<button class="btn-save-card" id="savebtn-'+i+'" onclick="saveOne('+i+')">💾 Lưu</button>';
    html+='<button class="btn-del" onclick="removeBLV('+i+')">✕</button>';
    html+='</div></div>';
    html+='<div class="fields">';
    html+='<div class="field half"><label>Tên BLV</label><input value="'+esc(b.name)+'" oninput="upd('+i+',\'name\',this.value)"/></div>';
    html+='<div class="field half" style="grid-column:span 2"><label>Link ảnh</label><input value="'+esc(b.img)+'" oninput="upd('+i+',\'img\',this.value)"/></div>';
    html+='<div class="field half"><label>👥 Nhóm</label><input value="'+esc(b.nhom)+'" oninput="upd('+i+',\'nhom\',this.value)"/></div>';
    html+='<div class="field half"><label>✈️ Telegram</label><input value="'+esc(b.tele)+'" oninput="upd('+i+',\'tele\',this.value)"/></div>';
    html+='<div class="field half"><label>💬 Zalo</label><input value="'+esc(b.zalo)+'" oninput="upd('+i+',\'zalo\',this.value)"/></div>';
    html+='</div></div></div>';
  });
  document.getElementById('cardList').innerHTML=html;
  initDrag();
  blvData.forEach(function(b,i){updateCardStyle(i,!!b.hidden);});
}

function previewImg(i,input){
  var file=input.files[0];if(!file)return;
  var reader=new FileReader();
  reader.onload=function(e){
    document.getElementById('preview-'+i).src=e.target.result;
    document.getElementById('preview-'+i).style.opacity=1;
    uploadImage(i,file,e.target.result);
  };
  reader.readAsDataURL(file);
}

function uploadImage(i,file,dataUrl){
  var b64=dataUrl.split(',')[1];
  var path='image/BLV/'+file.name;
  showStatus('ok','Đang upload ảnh...');
  var h={'Accept':'application/vnd.github.v3+json'};
  if(TOKEN)h['Authorization']='token '+TOKEN;
  fetch('https://api.github.com/repos/'+REPO+'/contents/'+path,{headers:h})
  .then(function(r){return r.ok?r.json():null;})
  .then(function(ex){
    var body={message:'Upload: '+file.name,content:b64};
    if(ex&&ex.sha)body.sha=ex.sha;
    if(!TOKEN){showStatus('err','Cần GitHub token để upload ảnh');return Promise.reject(new Error('no token'));}
    return fetch('https://api.github.com/repos/'+REPO+'/contents/'+path,{
      method:'PUT',headers:{'Authorization':'token '+TOKEN,'Content-Type':'application/json'},
      body:JSON.stringify(body)
    });
  })
  .then(function(r){return r.json();})
  .then(function(d){
    if(d.content){blvData[i].img=path;showStatus('ok','✅ Upload xong: '+file.name);}
    else showStatus('err','Lỗi upload ảnh: '+(d.message||'unknown'));
  })
  .catch(function(e){if(e.message!=='no token')showStatus('err','Lỗi: '+e.message);});
}

function saveOne(i){
  var btn=document.getElementById('savebtn-'+i);
  if(btn){btn.disabled=true;btn.textContent='Đang lưu...';}
  showStatus('ok','Đang lưu...');
  fetch(WORKER_URL,{method:'PUT',headers:{'Content-Type':'application/json','Authorization':'Bearer '+WORKER_PASS},body:JSON.stringify({blvs:blvData})})
  .then(function(r){return r.json();})
  .then(function(d){
    if(btn){btn.disabled=false;btn.textContent='💾 Lưu';}
    if(d.ok)showStatus('ok','✅ Đã lưu! Index cập nhật ngay lập tức!');
    else showStatus('err','Lỗi: '+(d.error||JSON.stringify(d)));
  })
  .catch(function(e){if(btn){btn.disabled=false;btn.textContent='💾 Lưu';}showStatus('err','Lỗi: '+e.message);});
}

function saveAll(){
  showStatus('ok','Đang lưu...');
  fetch(WORKER_URL,{method:'PUT',headers:{'Content-Type':'application/json','Authorization':'Bearer '+WORKER_PASS},body:JSON.stringify({blvs:blvData})})
  .then(function(r){return r.json();})
  .then(function(d){
    if(d.ok)showStatus('ok','✅ Đã lưu! Index cập nhật ngay lập tức!');
    else showStatus('err','Lỗi: '+(d.error||JSON.stringify(d)));
  })
  .catch(function(e){showStatus('err','Lỗi: '+e.message);});
}

(function(){
  fetch(WORKER_URL)
  .then(function(r){return r.json();})
  .then(function(d){blvData=d.blvs||[];renderCards();})
  .catch(function(e){blvData=[];renderCards();showStatus('err','Không tải được dữ liệu: '+e.message);});
})();
</script>
</body>
</html>
